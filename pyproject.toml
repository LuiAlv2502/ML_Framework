[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-ia"
version = "1.0.0"
description = "Framework inteligente para EDA, agrupamiento, clasificación y regresión con arquitectura multiagente y dashboard en Streamlit (EIF420O, UNA)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "xgboost>=2.0",
    "scipy>=1.10",
    "umap-learn>=0.5",
    "streamlit>=1.40",
    "plotly>=5.18",
    "openai>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["framework_ia*", "frontend*"]

[tool.setuptools.package-data]
framework_ia = ["models/.gitkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
